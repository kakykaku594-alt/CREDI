services:
  - type: web
    name: credit-guide-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: credit-guide-db
          property: connectionString

databases:
  - name: credit-guide-db
    plan: free
